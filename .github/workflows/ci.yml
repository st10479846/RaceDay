name: RaceDay CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "===== Repo root ====="
          ls -la
          echo ""
          echo "===== docs/ folder ====="
          ls -la docs || echo "docs folder NOT FOUND"
          echo ""
          echo "===== .github/ folder ====="
          ls -la .github || echo ".github folder NOT FOUND"

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::docs folder missing"
            exit 1
          fi
          echo "docs folder OK"

      - name: Check for ERD
        run: |
          find docs -iname "*ERD*" | head -5
          if [ -z "$(find docs -iname '*ERD*')" ]; then
            echo "::error::ERD not found in docs/"
            exit 1
          fi
          echo "ERD OK"

      - name: Check for API Endpoint Plan
        run: |
          find docs -iname "*Endpoint*" | head -5
          if [ -z "$(find docs -iname '*Endpoint*')" ]; then
            echo "::error::API Endpoint Plan not found in docs/"
            exit 1
          fi
          echo "API Endpoint Plan OK"

      - name: Check for SQL script
        run: |
          find docs -iname "*.sql" | head -5
          if [ -z "$(find docs -iname '*.sql')" ]; then
            echo "::error::SQL script not found in docs/"
            exit 1
          fi
          echo "SQL script OK"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md missing"
            exit 1
          fi
          echo "README OK"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "===== Repo root ====="
          ls -la
          echo ""
          echo "===== Looking for .sln files ====="
          find . -maxdepth 3 -name "*.sln" -not -path "./.git/*"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          if [ ! -f "RaceDay.sln" ]; then
            echo "::error::RaceDay.sln not found at repo root"
            exit 1
          fi
          dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal