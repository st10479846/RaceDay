name: RaceDay CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "=== Root ==="; ls -la
          echo "=== docs ==="; ls -la docs

      - name: Check docs folder exists
        run: test -d docs

      - name: Check ERD exists
        run: test -n "$(find docs -iname '*ERD*')"

      - name: Check API Endpoint Plan exists
        run: test -n "$(find docs -iname '*Endpoint*')"

      - name: Check SQL script exists
        run: test -f docs/RaceDay_Database.sql

      - name: Check SQL contains required tables
        run: |
          grep -qi "CREATE TABLE Users" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Events" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Results" docs/RaceDay_Database.sql

      - name: Check README exists
        run: test -f README.md

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo structure
        run: ls -la

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.sln --no-build --configuration Release