name: RaceDay CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------
  # Job 1: Validate Part 1 documentation
  # ----------------------------------------------------------
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs folder exists
        run: test -d docs

      - name: Check ERD exists
        run: |
          test -f docs/RaceDay_ERD.jpg || test -f docs/RaceDay_ERD.pdf

      - name: Check API Endpoint Plan exists
        run: test -f "docs/API Endpoint Plan ST10479846.pdf"

      - name: Check SQL script exists
        run: test -f docs/RaceDay_Database.sql

      - name: Check SQL contains required tables
        run: |
          grep -qi "CREATE TABLE Users" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Events" docs/RaceDay_Database.sql
          grep -qi "CREATE TABLE Results" docs/RaceDay_Database.sql

      - name: Check README exists
        run: test -f README.md

  # ----------------------------------------------------------
  # Job 2: Build and test the API
  # ----------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal