name: RaceDay CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "===== Repo root ====="
          ls -la
          echo ""
          echo "===== docs/ folder ====="
          ls -la docs

      - name: Check docs folder exists
        run: test -d docs

      - name: Check for ERD
        run: |
          find docs -iname "*ERD*" | head -5
          test -n "$(find docs -iname '*ERD*')"

      - name: Check for API Endpoint Plan
        run: |
          find docs -iname "*Endpoint*" | head -5
          test -n "$(find docs -iname '*Endpoint*')"

      - name: Check for SQL script
        run: |
          find docs -iname "*.sql" | head -5
          test -n "$(find docs -iname '*.sql')"

      - name: Check README exists
        run: test -f README.md

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "===== Repo root ====="
          ls -la
          echo ""
          echo "===== RaceDay/ folder ====="
          ls -la RaceDay

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build
        run: dotnet build RaceDay/RaceDay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay/RaceDay.slnx --no-build --configuration Release --verbosity normal