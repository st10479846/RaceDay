name: Docs Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Validate docs folder exists
      run: |
        if [ ! -d "docs" ]; then
          echo "Error: docs folder not found"
          exit 1
        fi
        echo "✅ docs folder exists"

    - name: Check for ERD file
      run: |
        if [ ! -f "docs/erd.png" ] && [ ! -f "docs/erd.pdf" ]; then
          echo "Error: ERD file (erd.png or erd.pdf) not found in docs folder"
          exit 1
        fi
        echo "✅ ERD file found"

    - name: Check for API endpoint plan
      run: |
        if [ ! -f "docs/api_endpoint_plan.md" ] && [ ! -f "docs/api_endpoint_plan.pdf" ]; then
          echo "Error: API endpoint plan not found in docs folder"
          exit 1
        fi
        echo "✅ API endpoint plan found"

    - name: Check for SQL script
      run: |
        if [ ! -f "docs/database_script.sql" ]; then
          echo "Error: SQL script not found in docs folder"
          exit 1
        fi
        echo "✅ SQL script found"

    - name: Check SQL script syntax (basic)
      run: |
        if ! grep -q "CREATE DATABASE" docs/database_script.sql; then
          echo "Error: SQL script missing CREATE DATABASE statement"
          exit 1
        fi
        echo "✅ SQL script contains CREATE DATABASE"

    - name: Check for README
      run: |
        if [ ! -f "README.md" ]; then
          echo "Error: README.md not found"
          exit 1
        fi
        echo "✅ README.md found"

    - name: Validate successful completion
      run: echo " All documentation checks passed!"